<text x="30" y="578" fill="#82858d" font-size="12.5">null (L16 interior rewire, 3 draws): +20% MORE depth at 0.5-2 Hz (0.349&#177;.002 vs 0.288) &#8212; real wiring attenuates rhythm below its degree class (L16 envelope-width twin); both arms die at 10 Hz = floor is model-class</text>
<text x="30" y="600" fill="#82858d" font-size="12.5">n_fit 2.7-3.2 per pool = the L21 2-hop sheet, NOT the ~9-stage transit delay &#8212; attenuation rides short paths, smear rides the long tail | 5Hz DT10 0.064 vs DT2 0.057 (corner verdict unchanged)</text>
